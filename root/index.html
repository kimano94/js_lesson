<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Table</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body id="Body">
    <div id="Buttons">
      <button class="UI" id="Table_Button" onclick="NewTable()">
        Создать таблицу
      </button>
      <div class="Row">
        <label class="UI" hidden>Количество рядов:</label>
        <input class="UI" id="Row" type="number" placeholder="Ряды:" hidden />
        <button class="UI" onclick="NewTr()" hidden>Добавить ряд</button>
      </div>

      <div class="Row">
        <label class="UI" hidden>Количество столбцов:</label>
        <input
          class="UI"
          id="Row"
          type="number"
          placeholder="Столбец:"
          hidden
        />
        <button class="UI" onclick="NewTd()" hidden>Добавить столбец</button>
      </div>
      <div class="Row">
        <label class="Search" hidden>Вертикальная позиция</label>
        <input
          class="Search"
          id="Tr"
          type="number"
          placeholder="В столбце:"
          hidden
        />
      </div>
      <div class="Row">
        <label class="Search" hidden>Горизонтальная позиция</label>
        <input
          class="Search"
          id="Td"
          type="number"
          placeholder="В столбце:"
          hidden
        />
      </div>
      <button class="Search" onclick="Search()" hidden>Поиск</button>
      <button class="UI" onclick="ChangeMode()" id="Change_Mode" hidden>
        Поменять режим
      </button>
    </div>
    <div id="Table_div"></div>
    <div id="Save">
      <button class="UI" onclick="Save()" hidden>Сохранить</button>
    </div>
    <script src="index.js"></script>
  </body>
</html>
